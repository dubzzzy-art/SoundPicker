appId: app.soundpicker.desktop
productName: SoundPicker
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
# No native modules: nothing to rebuild.
npmRebuild: false
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sound Picker
  uninstallDisplayName: Sound Picker
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
  category: public.app-category.music
  # CFBundleName must stay productName: Electron finds its helpers by it.
  extendInfo:
    CFBundleDisplayName: Sound Picker
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
